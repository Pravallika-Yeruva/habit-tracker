<form class="add-task-form" (ngSubmit)="submit()">
  <label class="visually-hidden" for="new-task">
    {{ task ? 'Edit task name' : 'Task name' }}
  </label>
  @if (!task) {
    <div class="quick-tasks" role="group" aria-label="Quick task choices">
      <span class="quick-tasks-label">Quick add</span>
      <div class="quick-task-options">
        @for (quickTask of quickTasks; track quickTask) {
          <button
            class="quick-task-button"
            type="button"
            [class.selected]="taskDraft.title === quickTask"
            [attr.aria-pressed]="taskDraft.title === quickTask"
            (click)="chooseQuickTask(quickTask)"
          >
            {{ quickTask }}
          </button>
        }
      </div>
    </div>
  }
  <input
    id="new-task"
    class="task-title-input"
    name="newTaskTitle"
    type="text"
    placeholder="What would you like to do?"
    [(ngModel)]="taskDraft.title"
    maxlength="100"
    required
    autofocus
  />
  <div class="form-field task-time-field">
    <label for="task-time">
      Task time <span class="optional-label">optional</span>
    </label>
    <input
      id="task-time"
      name="taskTime"
      type="text"
      inputmode="text"
      placeholder="--:-- --"
      autocomplete="off"
      maxlength="8"
      aria-describedby="task-time-hint"
      [value]="taskTimeInput"
      (input)="updateTaskTime($event)"
    />
    <span id="task-time-hint" class="task-time-hint">Enter a time like 08:30 AM or 08:30 PM.</span>
    @if (taskTimeInput && !isTaskTimeValid) {
      <span class="task-time-error" role="alert">Use the format --:-- AM or --:-- PM.</span>
    }
  </div>
  <label class="form-field">
    <span>Repeat</span>
    <select name="newTaskRepeat" [(ngModel)]="taskDraft.repeat">
      <option value="none">Does not repeat</option>
      <option value="daily">Every day</option>
      <option value="weekly">Every week</option>
      <option value="monthly">Every month</option>
    </select>
  </label>
  <div class="task-form-options">
    <div class="color-picker" role="group" aria-label="Task color">
      <span class="option-label">Color</span>
      @for (color of taskColors; track color) {
        <button
          class="color-swatch"
          type="button"
          [style.--swatch-color]="colorValue(color)"
          [class.selected]="taskDraft.color === color"
          [attr.aria-label]="'Use ' + color + ' color'"
          [attr.aria-pressed]="taskDraft.color === color"
          (click)="taskDraft.color = color"
        ></button>
      }
    </div>
    <app-reminder
      [reminderTime]="taskDraft.reminderTime"
      [sendNotification]="taskDraft.sendNotification"
      (reminderChange)="setReminder($event)"
    />
  </div>
  <button
    class="save-button"
    type="submit"
    [disabled]="!taskDraft.title.trim() || !isTaskTimeValid"
  >
    {{ task ? 'Save changes' : 'Add' }}
  </button>
  <button class="cancel-button" type="button" (click)="cancel.emit()">Cancel</button>
</form>
